version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: randomchat-db
    environment:
      POSTGRES_DB: randomchat
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - randomchat-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: randomchat-backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/randomchat
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CORS_ORIGINS: http://localhost:80,http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - randomchat-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: randomchat-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - randomchat-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  randomchat-network:
    driver: bridge
