# Server Configuration
server.port=8082

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/randomchat}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# OpenAI Configuration
openai.api.key=${OPENAI_API_KEY:}
openai.api.url=https://api.openai.com/v1/chat/completions
openai.model=gpt-4
openai.timeout=10000

# Google AI Configuration
google.ai.api.key=${GOOGLE_AI_API_KEY:}
google.ai.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-lite-latest:generateContent
google.ai.timeout=10000

# Options: "openai" (default) or "google"
ai.provider=${AI_PROVIDER:google}

# CORS Configuration
cors.allowed.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8081}

# Session Configuration
session.timeout.minutes=30

# Logging
logging.level.hu.bme.mit.randomchat=DEBUG
logging.level.org.springframework.web=INFO
